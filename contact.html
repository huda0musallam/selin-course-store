<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | Selin Baby Store</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body data-page="contact">
    <!-- Shared header (same on every page) -->
    <header class="site-header">
      <div class="container site-header__inner">
        <a
          class="site-header__brand"
          href="/"
          aria-label="Selin Kids Store home"
        >
          <img
            src="/brand/selin-logo.png"
            alt="Selin Kids Store"
            width="1200"
            height="720"
          />
        </a>

        <nav class="site-nav" aria-label="Main">
          <ul class="site-nav__list">
            <li><a class="site-nav__link" href="/#catalog">Shop</a></li>
            <li><a class="site-nav__link" href="#contact">Contact</a></li>
            <li>
              <a
                class="site-nav__link site-nav__link--cart"
                href="/cart.html"
                aria-current="page"
              >
                Cart
                <span class="cart-badge">
                  <span data-cart-count>0</span>
                  <span class="visually-hidden"> items</span>
                </span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="contact-section">
        <h1>Contact Us</h1>
        <p>We'd love to hear from you!</p>

        <!-- Contact form will go here -->
        <form class="contact-form" action="#" method="post">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <input
              type="text"
              id="subject"
              name="subject"
              placeholder="Enter subject"
              required
            />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea
              id="message"
              name="message"
              placeholder="Write your message"
              required
              rows="5"
            ></textarea>
          </div>

          <button type="submit">Send Message</button>
        </form>
      </section>
    </main>

    <!-- Shared footer (same on every page) -->
    <footer id="contact" class="site-footer">
      <div class="container site-footer__inner">
        <div class="site-footer__brand">
          <img
            src="/brand/selin-logo.png"
            alt="Selin Kids Store"
            width="1200"
            height="720"
          />
          <p>Thoughtfully chosen essentials for your little one.</p>
        </div>

        <nav aria-label="Footer">
          <h2 class="site-footer__heading">Explore</h2>
          <ul class="site-footer__links">
            <li><a href="/#catalog">Shop all products</a></li>
            <li><a href="/cart.html">Your cart</a></li>
          </ul>
        </nav>

        <div>
          <h2 class="site-footer__heading">Contact</h2>
          <ul class="site-footer__links">
            <li>
              <a href="mailto:hello@selin.example">hello@selin.example</a>
            </li>
          </ul>
        </div>
      </div>

      <p class="container site-footer__bottom">
        &copy; 2026 Selin Kids Store. A training project.
      </p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
